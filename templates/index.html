<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalcWorld - Universal Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
            font-size: 16px;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            background: #334155;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .tab:hover {
            background: #475569;
        }

        .tab.active {
            background: #2563eb;
        }

        /* =========================
           CALCULATOR
        ========================= */

        .calculator {
            background: #111827;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* =========================
           DISPLAY
        ========================= */

        .display {
            width: 100%;
            height: 80px;

            background: #020617;
            color: white;

            border: 2px solid #334155;
            border-radius: 12px;

            outline: none;

            font-size: 30px;
            text-align: right;

            padding: 15px;
            margin-bottom: 15px;
        }

        .display:focus {
            border-color: #2563eb;
        }

        /* =========================
           ANGLE MODE
        ========================= */

        .angle-mode {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .angle-mode button {
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            background: #334155;
            color: white;
            cursor: pointer;
        }

        .angle-mode button.active {
            background: #2563eb;
        }

        /* =========================
           SCIENTIFIC BUTTONS
        ========================= */

        .scientific-buttons {
            display: none;

            grid-template-columns: repeat(5, 1fr);

            gap: 10px;

            margin-bottom: 12px;
        }

        .scientific-buttons button {
            height: 50px;

            border: none;
            border-radius: 8px;

            background: #475569;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .scientific-buttons button:hover {
            background: #64748b;
        }

        /* =========================
           BASIC BUTTONS
        ========================= */

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }

        .calc {
            height: 60px;

            border: none;
            border-radius: 10px;

            background: #334155;
            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        .calc:hover {
            background: #475569;
        }

        .operator {
            background: #2563eb;
        }

        .operator:hover {
            background: #1d4ed8;
        }

        .clear {
            background: #dc2626;
        }

        .clear:hover {
            background: #b91c1c;
        }

        .equal {
            background: #16a34a;

            grid-column: span 2;
        }

        .equal:hover {
            background: #15803d;
        }

        /* =========================
           ERROR
        ========================= */

        .error-message {
            display: none;

            background: #7f1d1d;
            color: #fecaca;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 12px;

            text-align: center;

            font-size: 14px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            header h1 {
                font-size: 32px;
            }

            .calculator {
                padding: 12px;
            }

            .display {
                height: 70px;
                font-size: 24px;
            }

            .calc {
                height: 55px;
                font-size: 18px;
            }

            .scientific-buttons {
                grid-template-columns: repeat(4, 1fr);
            }

            .scientific-buttons button {
                font-size: 14px;
                height: 45px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>CalcWorld</h1>

        <p>Universal Online Calculator</p>

    </header>


    <!-- =========================
         CALCULATOR TABS
    ========================= -->

    <div class="tabs">

        <button
            class="tab active"
            id="basicTab"
            onclick="switchCalculator('basic')">

            Basic

        </button>


        <button
            class="tab"
            id="scientificTab"
            onclick="switchCalculator('scientific')">

            Scientific

        </button>

    </div>


    <!-- =========================
         CALCULATOR
    ========================= -->

    <div class="calculator" id="calculator">


        <!-- ERROR MESSAGE -->

        <div
            class="error-message"
            id="errorMessage">
        </div>


        <!-- =========================
             ANGLE MODE
        ========================= -->

        <div
            class="angle-mode"
            id="angleMode">

            <button
                id="degButton"
                class="active"
                onclick="setAngleMode('DEG')">

                DEG

            </button>


            <button
                id="radButton"
                onclick="setAngleMode('RAD')">

                RAD

            </button>

        </div>


        <!-- =========================
             SCIENTIFIC BUTTONS
        ========================= -->

        <div
            class="scientific-buttons"
            id="scientificButtons">


            <button
                onclick="insertFunction('sin')">

                sin

            </button>


            <button
                onclick="insertFunction('cos')">

                cos

            </button>


            <button
                onclick="insertFunction('tan')">

                tan

            </button>


            <button
                onclick="insertFunction('sqrt')">

                √

            </button>


            <button
                onclick="insertFunction('log')">

                log

            </button>


            <button
                onclick="insertFunction('ln')">

                ln

            </button>


            <button
                onclick="insertConstant('pi')">

                π

            </button>


            <button
                onclick="insertConstant('e')">

                e

            </button>


            <button
                onclick="squareNumber()">

                x²

            </button>


            <button
                onclick="factorialNumber()">

                x!

            </button>

        </div>


        <!-- =========================
             DISPLAY
        ========================= -->

        <input
            type="text"
            id="display"
            class="display"
            placeholder="0"
            autocomplete="off"
            inputmode="decimal"
        >


        <!-- =========================
             CALCULATOR BUTTONS
        ========================= -->

        <div class="buttons">


            <!-- ROW 1 -->

            <button
                class="calc clear"
                onclick="clearDisplay()">

                C

            </button>


            <button
                class="calc"
                onclick="deleteLast()">

                DEL

            </button>


            <button
                class="calc"
                onclick="addToDisplay('%')">

                %

            </button>


            <button
                class="calc operator"
                onclick="addToDisplay('/')">

                ÷

            </button>


            <!-- ROW 2 -->

            <button
                class="calc"
                onclick="addToDisplay('7')">

                7

            </button>


            <button
                class="calc"
                onclick="addToDisplay('8')">

                8

            </button>


            <button
                class="calc"
                onclick="addToDisplay('9')">

                9

            </button>


            <button
                class="calc operator"
                onclick="addToDisplay('*')">

                ×

            </button>


            <!-- ROW 3 -->

            <button
                class="calc"
                onclick="addToDisplay('4')">

                4

            </button>


            <button
                class="calc"
                onclick="addToDisplay('5')">

                5

            </button>


            <button
                class="calc"
                onclick="addToDisplay('6')">

                6

            </button>


            <button
                class="calc operator"
                onclick="addToDisplay('-')">

                −

            </button>


            <!-- ROW 4 -->

            <button
                class="calc"
                onclick="addToDisplay('1')">

                1

            </button>


            <button
                class="calc"
                onclick="addToDisplay('2')">

                2

            </button>


            <button
                class="calc"
                onclick="addToDisplay('3')">

                3

            </button>


            <button
                class="calc operator"
                onclick="addToDisplay('+')">

                +

            </button>


            <!-- ROW 5 -->

            <button
                class="calc"
                onclick="addToDisplay('0')">

                0

            </button>


            <button
                class="calc"
                onclick="addToDisplay('.')">

                .

            </button>


            <button
                class="calc"
                onclick="addToDisplay('(')">

                (

            </button>


            <button
                class="calc"
                onclick="addToDisplay(')')">

                )

            </button>


            <!-- EQUAL -->

            <button
                class="calc equal"
                onclick="calculate()">

                =

            </button>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       GLOBAL VARIABLES
    ===================================================== */

    let calculatorType = "basic";

    let angleMode = "DEG";

    const display =
        document.getElementById("display");

    const calculator =
        document.getElementById("calculator");

    const errorMessage =
        document.getElementById("errorMessage");


    /* =====================================================
       SWITCH CALCULATOR
    ===================================================== */

    function switchCalculator(type) {

        calculatorType = type;

        clearDisplay();

        hideError();


        const basicTab =
            document.getElementById("basicTab");

        const scientificTab =
            document.getElementById("scientificTab");

        const scientificButtons =
            document.getElementById("scientificButtons");

        const angleModeDiv =
            document.getElementById("angleMode");


        if (type === "basic") {

            basicTab.classList.add("active");

            scientificTab.classList.remove("active");

            scientificButtons.style.display = "none";

            angleModeDiv.style.display = "none";

        }


        else {

            basicTab.classList.remove("active");

            scientificTab.classList.add("active");

            scientificButtons.style.display = "grid";

            angleModeDiv.style.display = "flex";

        }

    }


    /* =====================================================
       ADD TO DISPLAY
    ===================================================== */

    function addToDisplay(value) {

        hideError();

        display.value += value;

        display.focus();

    }


    /* =====================================================
       CLEAR
    ===================================================== */

    function clearDisplay() {

        display.value = "";

        hideError();

        display.focus();

    }


    /* =====================================================
       DELETE
    ===================================================== */

    function deleteLast() {

        display.value =
            display.value.slice(0, -1);

        hideError();

        display.focus();

    }


    /* =====================================================
       CALCULATE
    ===================================================== */

    async function calculate() {

        const expression =
            display.value.trim();


        if (!expression) {

            return;

        }


        hideError();


        let endpoint;


        if (calculatorType === "basic") {

            endpoint = "/api/basic";

        }

        else {

            endpoint = "/api/scientific";

        }


        try {

            calculator.classList.add("loading");


            const response =
                await fetch(endpoint, {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        expression: expression,

                        angle_mode: angleMode

                    })

                });


            let data;


            try {

                data =
                    await response.json();

            }

            catch {

                throw new Error(
                    "Server returned an invalid response."
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Calculation failed."
                );

            }


            if (
                data.result === undefined ||
                data.result === null
            ) {

                throw new Error(
                    "No result returned by server."
                );

            }


            display.value =
                formatResult(data.result);

        }


        catch (error) {

            console.error(
                "CalcWorld error:",
                error
            );


            showError(
                error.message ||
                "Internal Server Error"
            );

        }


        finally {

            calculator.classList.remove("loading");

        }

    }


    /* =====================================================
       FORMAT RESULT
    ===================================================== */

    function formatResult(result) {

        if (typeof result === "number") {

            if (!Number.isFinite(result)) {

                return "Error";

            }


            return Number(
                result.toPrecision(12)
            ).toString();

        }


        return result;

    }


    /* =====================================================
       SCIENTIFIC FUNCTION
    ===================================================== */

    function insertFunction(functionName) {

        hideError();


        const value =
            display.value.trim();


        if (value === "") {

            display.value =
                functionName + "(";

        }

        else {

            display.value =
                functionName +
                "(" +
                value +
                ")";

        }


        display.focus();

    }


    /* =====================================================
       CONSTANT
    ===================================================== */

    function insertConstant(constant) {

        hideError();

        display.value += constant;

        display.focus();

    }


    /* =====================================================
       SQUARE
    ===================================================== */

    function squareNumber() {

        const value =
            display.value.trim();


        if (!value) {

            return;

        }


        display.value =
            "(" +
            value +
            ")^2";


        display.focus();

    }


    /* =====================================================
       FACTORIAL
    ===================================================== */

    function factorialNumber() {

        const value =
            display.value.trim();


        if (!value) {

            return;

        }


        display.value =
            "factorial(" +
            value +
            ")";


        display.focus();

    }


    /* =====================================================
       ANGLE MODE
    ===================================================== */

    function setAngleMode(mode) {

        angleMode = mode;


        const degButton =
            document.getElementById("degButton");

        const radButton =
            document.getElementById("radButton");


        if (mode === "DEG") {

            degButton.classList.add("active");

            radButton.classList.remove("active");

        }

        else {

            radButton.classList.add("active");

            degButton.classList.remove("active");

        }

    }


    /* =====================================================
       ERROR MESSAGE
    ===================================================== */

    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.style.display =
            "block";

    }


    function hideError() {

        errorMessage.textContent = "";

        errorMessage.style.display =
            "none";

    }


    /* =====================================================
       KEYBOARD SUPPORT
    ===================================================== */

    display.addEventListener(
        "keydown",
        function(event) {


            if (event.key === "Enter") {

                event.preventDefault();

                calculate();

            }


            if (event.key === "Escape") {

                event.preventDefault();

                clearDisplay();

            }


            if (event.key === "Backspace") {

                hideError();

            }

        }
    );


    /* =====================================================
       PREVENT INVALID BASIC CHARACTERS
    ===================================================== */

    display.addEventListener(
        "input",
        function() {

            hideError();

        }
    );


    /* =====================================================
       START IN BASIC MODE
    ===================================================== */

    switchCalculator("basic");

</script>

</body>

</html>
